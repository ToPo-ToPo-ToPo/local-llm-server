name: test

# Linux / Windows / macOS の 3 OS でテストを回す。開発機は macOS のみなので、この
# マトリクスが Linux/Windows 対応（llama.cpp 自動導入・動画入力）の回帰を防ぐ土台になる。
# mlx 系依存は pyproject の環境マーカーで Apple Silicon のときだけ入るため、Linux/Windows と
# GitHub の macOS runner（mlx 不在）でもテストは通る想定（フェイク中心・実 LLM 不使用）。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3 OS は主要 Python で、バージョン範囲（最小/最大）は ubuntu で追加確認する。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync (dev deps)
        run: uv sync --dev

      - name: Pytest
        # -rf で失敗一覧を、--tb=short で短いトレースバックを出す（-q の進捗バーだけだと
        # GitHub のログ取得が末尾を取りこぼし、失敗内容が分からなくなることがあるため）。
        run: uv run pytest -rf --tb=short

  quality:
    runs-on: ubuntu-latest
    name: security and static checks
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync (dev deps)
        run: uv sync --dev --frozen
      - name: Critical lint checks
        run: uv run ruff check --select E9,F63,F7,F82 local_llm_server tests
      - name: Type-check package
        run: >-
          uv run mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs
          local_llm_server
      - name: High-severity security scan
        run: uv run bandit -r local_llm_server -q -lll
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/local-llm-server-requirements.txt
          uv run pip-audit -r /tmp/local-llm-server-requirements.txt --no-deps --disable-pip
      - name: Product-code coverage floor
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
