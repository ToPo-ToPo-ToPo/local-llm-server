# ゲートウェイ設定の例。実際の設定は ~/.config/local-llm-server/gateway.toml の 1 箇所で、
# 初回の `gw start` がこのファイルを複製して自動生成する。以降の編集はそちらで行う
# （保存すればポリシー設定は稼働中でも反映される → docs/gateway.md）。
#
# 1 つの公開エンドポイント（下記 port）で複数モデルを束ね、リクエストの `model` を見て
# そのモデルのローカルサーバーへ振り分ける。各モデルは初回リクエスト時に遅延起動し、
# max_resident はハード上限で、空き枠が無ければ古いものから停止（LRU）。全て処理中なら空くまで
# 待つ（OOM 回避。load_timeout で打ち切り→503）。管理者はこのゲートウェイ 1 プロセスだけを起動/停止する。
#
# モデルの事前登録は不要。`dynamic = true`（既定）なので、クライアントが指定した `model` を
# その場でロード・管理する（バックエンドは ID から推論）。通常利用に加えて、画像入力（mmproj は
# 隣のファイルを自動検出）も、mlx-vlm の MTP（対応モデルは本体名から自動選択して ~2倍速）も、
# 事前登録なしで効く。下の [[models]] は任意で、parallel・llama.cpp の MTP・llama-server への
# 個別フラグ（extra_args）など、ID だけでは決まらない上書きが要るモデルだけ書く。
#
# 各クライアントは（クライアントはサーバーを起動せず接続するだけ）:
#   base_url = "http://127.0.0.1:8799/v1"        # ← 全クライアント共通（ゲートウェイ）
#   model    = "unsloth/Qwen3.6-27B-GGUF:UD-Q4_K_XL"  # ← 任意の（DL 済み）モデルを指定

host = "127.0.0.1"          # bind ホスト（省略時 127.0.0.1＝ローカルのみ）。別PCから繋ぐなら "0.0.0.0"（全IF公開）
port = 8799                 # 公開ポート（省略時 8799）。クライアントの base_url はここ
# api_key = "change-me"     # ネットワーク公開時の認証キー。設定するとクライアントは Authorization: Bearer <key> を要求される
                            # （省略/空で認証なし）。/admin/status・/admin/config はキーに関係なくローカル（127.0.0.1）限定。
                            # 別PCから繋ぐ手順は docs/gateway.md「別PCから接続する（ネットワーク公開）」を参照。
max_resident = 2            # 同時常駐モデル数のハード上限。空きが無ければ LRU 退避、全て処理中なら待つ（省略時 無制限）
                            # 2: Ikazuchi-Mal の会話(gemma-4-26B-A4B 4bit ≈15GB)と OS作業/X bot(Qwen3.6-27B 4bit ≈15GB)を
                            # 併用するため。1 だと切替のたびにモデル再ロード＋プロンプトキャッシュ全損が起きる（要 ~30GB+ RAM）
max_memory_fraction = 0.80  # 常駐モデルの推定占有量の合計を総RAMのこの割合に制限（省略で無効）
                            # 総RAM 275GB → 上限 220GB。max_resident は「数」の上限でしかなく、
                            # 150GB 級を 2 つ登録した今の構成（Inkling 4bit 148.5GB /
                            # DeepSeek-V4-Flash 4bit + MTP 165.1GB）では数の上限だけでは守れない
                            # （合計 313GB で 275GB を超える）。これを入れると片方をLRU退避してから
                            # ロードする。15GB 級（Qwen3.6-27B 16.1GB 等）の2本併用には影響しない
load_timeout = 300          # 全枠処理中のとき空くのを待つ最大秒数（超過で 503。省略時 300）
start_timeout = 600         # モデルサーバー1つの起動完了（ready）を待つ最大秒数（省略時 120）。巨大モデルや
                            # コールドディスクで 120 秒を超えるなら延ばす。
                            # 600: Inkling-Small（4bit・138GiB）のロードが既定 120 秒に収まらないため。
                            # 15GB 級のモデルの起動時間は変わらない（あくまで上限）
# request_timeout = 600     # 上流モデルサーバーとの通信が「無応答」のとき打ち切る秒数（省略時 600=10分。0 で無制限）。
                            # トークンが流れている限り切れないのでストリーミングの長時間生成は妨げない。
                            # ハングした／沈黙したサーバーが処理中扱いのまま枠を塞ぎ続ける事故の保険
idle_timeout = 1200         # この秒数（=20分）使われないモデルは自動アンロードしてメモリ解放（既定 1200。0 で無効）
session_ttl = 600           # 在席エージェントのハートビート猶予秒数。途絶でそのエージェントを無人扱い（既定 600。0 で無効）
                            # これは「release を送れずに落ちたエージェント」への保険であって、遅いエージェントを
                            # 切るためのものではない。旧既定 90 では、1 課題に数分かかる巨大モデル（148GB 級）を
                            # 使う CAD エージェントの足元でモデルがアンロードされ、21 秒の再ロードがクライアントの
                            # 入口プローブまで食い潰す事故が起きた
internal_base_port = 9001   # 内部モデルサーバーの割当開始ポート（9001, 9002, ... と連番）

# ── 繰り返しループ抑制（mlx / mlx-vlm 系のみ。既定で有効）──
# 低温・量子化のローカル LLM は「同じ内容を延々と繰り返して終わらない」degeneration に
# 陥りやすい。これを緩和するため、mlx 系バックエンド宛の chat リクエストへ
# repetition_penalty を**既定で注入**する（mlx-lm/mlx-vlm 拡張。llama-cpp は名前が
# repeat_penalty で別物なので対象外）。クライアントが自分で repetition_penalty を
# 指定していれば尊重して上書きしない。
# repetition_penalty = 1.1          # 既定 1.1（穏当）。1.1〜1.3 が実用域。大きいほど強く抑制するが
                                    # 文法・必要な繰り返しも巻き添えになり不自然になりやすい
# repetition_penalty = 0            # 0 / false / "off" で**無効化**（注入しない＝「設定しない」選択）
repetition_context_size = 64        # 参照する直近トークン窓（上流既定 20 は狭く長い反復退化を捉えきれない。研究推奨 64）
# repetition_penalty_skip_structured = true  # tools（native ツールコール）や response_format（構造化出力）を
#                                   # 含むリクエストには注入しない（既定 false＝全 chat に注入）。JSON 構文の
#                                   # 必須の繰り返しを減点しうるのを避ける保険（実測では 1.1 で実害なし）

# ── 在席ベースの即時アンロード（任意。明示すると idle_timeout を待たずに解放できる）──
# エージェントは利用開始/終了をゲートウェイへ通知できる。あるモデルに在席するエージェントが
# 0 になった瞬間（＝そのモデルを使う人が誰も居なくなった）、処理中でなければ即アンロードする。
#   開始: POST /admin/sessions/register   {"agent_id": "...", "model": "..."}
#   心拍: POST /admin/sessions/heartbeat  {"agent_id": "..."}            # session_ttl 内に定期送信
#   終了: POST /admin/sessions/release    {"agent_id": "..."}            # = DELETE /admin/sessions
# 終了通知を送れずに落ちたエージェントは、心拍が session_ttl 途絶した時点で掃除される。

# ── 自動更新（既定 true）──
# GitHub から clone して `make install`（editable 導入）で使う運用向け。常駐デーモンが起動 1 分後と
# 以降 1 時間毎に PyPI の最新版を確認し、新しければ `git pull --ff-only`（＋uv sync）でソースを追従し、
# 新コードで自分を再起動する。安全策として **既定ブランチ（main）・作業ツリーがクリーン・upstream
# 追跡ブランチのときだけ** 適用する（開発用の機能ブランチや未コミット変更がある PC では適用しない）。
# 再起動はゲートウェイがアイドル（処理中0・在席0）になった瞬間だけなので、進行中の生成を中断しない。
# git クローンでない（PyPI から素の `uv tool install` 等）場合は何もしない。false で完全無効。
# 今すぐ確認・適用したいときは `gw update`。
auto_update = true

# 未登録モデルの動的ロード（既定 true）。指定された model をその場で起動・管理し、一覧（`gw list`）に
# 現れる（アンロードで消える）。バックエンドは ID から推論（gguf→llama-cpp、mlx→mlx-vlm、他→OS 既定）。
# false にすると下の [[models]] に登録したものだけ提供する（旧挙動）。
dynamic = true
# disable_thinking = true   # 動的ロード時の既定（思考抑制）。事前登録は各 [[models]] が優先
# default_model = "..."     # `model` 省略リクエスト時のモデル（任意）
# draft_model = "off"       # 動的ロード時の MTP 既定。既定（未指定）は mlx-vlm を "auto"（対応表から
#                           # 自動選択）。"off" で動的 MTP を一律無効化、HF id で全モデルに明示指定
# parallel = 4              # 動的ロードする llama-cpp モデルの並列スロット既定（mlx 系は無視。→ docs/llama-cpp.md）

# ── llama.cpp（llama-server）バイナリの自動導入（任意。全省略で全自動）──
# Linux / Windows / macOS のどれでも、llama-cpp モデルを使う構成なら起動時に llama-server を
# 自動でダウンロード・導入する（PATH は汚さず管理ディレクトリへ。導入方法の選択肢は無い）。
# GPU があれば Vulkan、無ければ CPU、macOS は Metal を自動選択する。詳細は docs/llama-cpp.md。
# [llama_cpp]
# accel = "auto"            # auto=検出 / cuda（Windows 限定・要 cudart）/ vulkan / metal / cpu を明示
# pin = "b9946"             # ビルド番号を固定（省略で最新を取得し、以後は導入済みを使い続ける）

# ── vLLM / SGLang（任意。高スループット生成。Linux/NVIDIA・Windows は WSL2）──
# backend = "vllm" / "sglang" のモデルを [[models]] に登録すると使える（明示 opt-in）。
# 導入は自動: 現在の環境に有ればそれを使い、無ければ隔離 venv へ pip install する（設定不要）。
# vLLM は多人数同時・高スループット向け、SGLang は RadixAttention でエージェント運用に強い。
# 詳細は docs/vllm.md。

# ── 動画入力（任意）──
# リクエストの content に video_url（data URI / http URL / ローカルパス）を入れると、ゲートウェイが
# ffmpeg で等間隔にフレーム抽出し image_url 列に展開して上流へ渡す（llama-cpp / mlx-vlm 共通）。
# ffmpeg は pip 同梱（imageio-ffmpeg）で供給されるので追加インストール不要。ホットリロード対象。
# video_frames = 8          # 1 本の動画から抜くフレーム数（多いほど精細だがトークン増）
# video_max_edge = 768      # 各フレームの長辺ピクセル（縮小してトークン量を抑える）
# image_max_edge = 1024     # 静止画の長辺上限 px（既定 1024。0 で無効）。上流へ渡す前に縮小する。
#                           # 解像度上限の無い VLM（Qwen3.6 等）に巨大画像を渡すと vision トークンが
#                           # 数千に膨れ、Dense モデルでは prefill だけで数十秒かかる。→ docs/gateway.md

# ───────────────────────────────────────────────────────────────────────────────
# 事前登録（任意）。parallel・llama.cpp の MTP・llama-server への個別フラグ等、ID だけでは
# 決まらない上書きが要るモデルだけ書く。dynamic = true なら下は全て省略可（mlx-vlm の MTP と
# 画像入力は動的ロードでも自動で効くので、それ目的の事前登録は不要）。必要なら例のコメントを外す。
#
# mlx-vlm で MTP を個別に無効化／別ドラフターを明示したいときだけ（自動で効くので通常は不要）:
# [[models]]
# model = "ToPo-ToPo/Qwen3.6-27B-mlx-4bit"
# backend = "mlx-vlm"
# draft_model = "off"       # このモデルだけ MTP を無効化（HF id を書けば別ドラフターを明示）
#
# ── Ternary Bonsai 27B（Prism ML の三値モデル。Qwen3.6-27B ベースの vision-language）──
# 三値 2bit の MLX パックは **素の mlx-vlm（本リポジトリが既にピンしている 0.6.3）で動く**
# （フォーク不要。フォークが要るのは 1bit 版のみで、それは iPhone 向け）。事前登録するのは
# ID から決まらない上書き（MTP 無効化）を効かせるためで、動的ロードでも backend は mlx-vlm に
# 推論される。事前に `hf download prism-ml/Ternary-Bonsai-27B-mlx-2bit`（約8.5GB・公開リポ）で取得しておくこと。
#   推奨サンプリング（クライアント側で指定）: temperature = 0.7 / top_p = 0.95 / top_k = 20
#   思考（thinking）は既定OFF運用。mlx-vlm サーバは enable_thinking 未指定なら思考OFF（実測確認済み）。
#   注意: Bonsai の公表ベンチ（三値 80.49 / FP16比 94.6%）は全て thinking mode の値。数学・コード・
#   エージェント等の推論タスクで質を出したいリクエストだけ enable_thinking=true を送る運用にする。
#
#   思考チャネルの分離（thinking を出しても content を汚さない）: mlx-vlm 0.6.3 は生成テキストから
#   reasoning を切り出して reasoning_content へ回す。その開始/終了マーカーはモデルごとに違い、
#   gemma-4-A4B 系は「開 <|channel>thought / 閉 <channel|>」を使う（<think>…</think> とは別形式）。
#   0.6.3 の既定マーカーには両形式が含まれるが、内部既定に依存しないよう server.py が mlx-vlm 起動時に
#   MLX_VLM_THINKING_START_TOKEN/END_TOKEN を明示設定する。これにより gemma-4 の thought/<channel|> が
#   content へ漏れない（旧 mlx-vlm ではこの既定が無く漏れていた＝要 0.6.3 以上、pyproject でピン済み）。
[[models]]
model = "prism-ml/Ternary-Bonsai-27B-mlx-2bit"
backend = "mlx-vlm"       # 27B は vision-language。mlx-vlm なら画像入力も使える（三値パックは FP16 vision tower 同梱）
draft_model = "off"       # DSpark drafter は Apple Silicon の batch-1 では償却できず既定無効（→ off を明示）
# disable_thinking は mlx-vlm では build_command が参照しない（無効）。既定OFF はサーバ側の挙動で担保される

# ── Bonsai 27B 1-bit（GGUF / llama.cpp 経路。軽量テキスト運用）──
# 1bit は MLX（素の mlx）では動かない（1bit カーネル無し）が、**GGUF なら mainline llama.cpp の
# Metal でそのまま動く**（Q1_0 は upstream にマージ済み。フォーク不要。実測 ~59 tok/s）。
# model は `org/repo:セレクタ`。`:Q1_0` で多量子化リポから本体1ファイル（Bonsai-27B-Q1_0.gguf, 3.8GB）を特定。
# 取得: `hf download prism-ml/Bonsai-27B-gguf Bonsai-27B-Q1_0.gguf`
# 画像入力を使うなら別途 mmproj を同じスナップショットへ置くと自動で --mmproj が付く:
#   `hf download prism-ml/Bonsai-27B-gguf Bonsai-27B-mmproj-Q8_0.gguf`（0.63GB）
# 導入後は実プロセス起動コマンドに再ロードが要る（mmproj は起動時フラグのため、既にロード済み
# のインスタンスには効かない。次のリクエストで自動再ロードされるのを待つか、明示的に落とす）。
# vision 実測確認済み: 図形（青四角・赤丸）と文字（"HELLO"）を含む画像を正しく認識・記述。
# RSS は mmproj 分（0.63GB）増えて ~7.1GB（8GB VRAM機にはまだ収まる）。テキストのみの
# リクエストには速度・精度とも影響なし（mmproj はロードされるが画像が来た時だけ使われる）。
#
# コーディング品質は実測で三値と同等（LeetCode easy〜medium 8問、thinking ON/OFF とも 24/24）。
# 数学等の推論タスクでの三値との差は未検証（→ 必要なら追加で比較すること）。
#
# ⚠ メモリの罠: --ctx-size 未指定だと llama-server は Bonsai のネイティブ最大コンテキスト
# （262144）分の KV キャッシュを FP16 で丸ごと事前確保する。動的ロード（この事前登録なし）で
# 実測すると本体 3.8GB のはずが RSS ~24.5GB に膨張する（三値 mlx-vlm の 8.67GB より大きい＝
# 「1bit だから軽い」が逆転する）。下の extra_args で -c 32768 に絞れば **実測 RSS 6.38GB**
# （ゲートウェイ経由の実プロセスで確認済み。8GB VRAM機にも収まる）。用途に応じて -c を
# 調整すること（大きい方が要 RAM、小さい方が省 RAM）。
[[models]]
model = "prism-ml/Bonsai-27B-gguf:Q1_0"
backend = "llama-cpp"
draft_model = "off"       # DSpark drafter は使わない（Apple Silicon batch-1 で非効率。上の三値と同方針）
extra_args = ["-c", "32768"]  # コンテキストを32Kに制限してRAM膨張を防ぐ（上の罠を参照。既定262144は不可）
disable_thinking = true   # 既定は思考OFF。起動時の --chat-template-kwargs で正しく抑制される
                          # （ゲートウェイ経由の実プロセスで確認済み: 無指定→抑制、明示 true→思考する）。
                          # 思考を効かせたいリクエストだけ chat_template_kwargs={"enable_thinking": true} を送る

# ── Inkling-Small（Thinking Machines。276B total / 12B active の疎 MoE。text+image+audio 入力）──
# 公式 bf16（thinkingmachines/Inkling-Small・531.9GB）を自前で MLX 4bit へ変換したもの
# （実測 4.506 bits/weight・138GiB。単体生成の Peak memory 148.7GB・53 tok/s）。
# HF にも公開: ToPo-ToPo/Inkling-Small-mlx-4bit（2bit 版もあり）。
#
# ⚠ mlx-vlm 0.6.9 以降が必須（pyproject でピン済み）。0.6.7/0.6.8 は Inkling を
#   公開ローダー経路で読めず、当時は config のキー名翻訳と起動時シムで回避していた。
#   さらに深刻なのは、当時の実装が MoE の mlp.global_scale（50件）と mlp.gate.bias（40件）を
#   持たず、**変換時にこれらの重みを黙って落としていた**こと（形状エラーも出ない）。
#   0.6.9 はこれらを扱い、公式 config をそのまま読む。翻訳もシムも不要になった。
#   → 変換は scripts/convert_inkling.py（0.6.9 未満なら実行前に止まる）
#
# 画像入力: 実測確認済み（640x480 の画像が 204 vision トークンに展開され、
#   青い四角＋赤い丸＋"HELLO" を正確に認識）。
#
# MTP（speculative decoding）: **使えない**（0.6.9 で実測）。
#   公式 bf16 内蔵の model.mtp.* を mlx-vlm 付属の
#   `python -m mlx_vlm.speculative.drafters.inkling_mtp.split` で切り出せるが:
#     ① 0.6.8 までは最初の draft block で空キャッシュ（keys が None）を参照して落ちた。
#        0.6.9 の _snapshot_cache_state 修正でクラッシュ自体は解消。
#     ② しかし実測すると **13.2 tok/s（MTP無しは 39.9 tok/s）** で 3 倍遅い（採択率が低く、
#        ドラフト生成と検証のコストだけが乗る）。
#     ③ さらに temperature=0 でも **MTP 有無で出力が分岐する**。投機デコードは lossless で
#        あるべきなので、巻き戻しか受理判定が正しく動いていない。速度以前に品質を保証できない。
#   以上より切り出したドラフターはローカルからも削除した（必要なら公式 bf16 から作り直せるが、
#   532GB の再取得が要る）。上流が ②③ を直したら再検討する。
[[models]]
model = "ToPo-ToPo/Inkling-Small-mlx-4bit"   # 自前変換を HF へ公開したもの（事前に hf download 済み）
backend = "mlx-vlm"
disable_thinking = true     # 思考 OFF（他モデルと揃える）。mlx-vlm には build_command 側で
                            # 止める手段が無いので、ゲートウェイが reasoning_effort="none" を
                            # リクエストへ注入する。Inkling のテンプレートは enable_thinking を
                            # 見ず、指定が無いと必ず「Thinking effort level: 0.9」を入れるため、
                            # これが無いと毎回ほぼ最大の思考が走る（CAD 1 課題で 3〜8 分）。
                            # 思考させたいリクエストだけ reasoning_effort を明示すれば尊重される
draft_model = "off"         # ← 上流バグで MTP が使えない（上記）

# ── DeepSeek-V4-Flash-0731（DeepSeek の 304B 疎 MoE。テキスト専用・context 1M・MIT）──
# 公式 FP8（deepseek-ai/DeepSeek-V4-Flash-0731・166.9GB・e4m3 block 128x128）を自前で MLX 4bit へ
# 変換したもの（実測 4.339 bits/weight・144GiB。単体生成の Peak memory 154.3GB・31 tok/s）。
#
# Inkling と違い**回避策が一切要らない**: 公式 config の model_type が mlx-vlm の実装と同じ
# `deepseek_v4` で、`ModelConfig` に text_config フィールドが無いため汎用ローダーの
# update_module_configs も素通りする。prompt_utils.MODEL_CONFIG にも TEXT_ONLY で登録済み。
# 変換は `mlx_vlm.convert -q --q-bits 4 --q-group-size 64` をそのまま実行するだけでよい
# （公式が FP8 でも、models/deepseek_v4 の sanitize が .weight/.scale の対を解いて再量子化する）。
#
# MTP: 公式チェックポイントに内蔵された MTP を mlx-vlm 付属の
#   `python -m mlx_vlm.speculative.drafters.deepseek_v4_mtp.split` で切り出した bf16（10.9GB）。
#   Inkling の MTP は上流バグで使えなかったが、こちらは別実装なので有効化して試す。
#   不調なら draft_model = "off" にする。
[[models]]
model = "ToPo-ToPo/DeepSeek-V4-Flash-0731-mlx-4bit"   # 自前変換を HF へ公開したもの（事前に hf download 済み）
backend = "mlx-vlm"
disable_thinking = true     # 思考 OFF（他モデルと揃える）。reasoning_effort="none" を注入する。
                            # 未設定だと既定で思考し、CAD 1 課題の生成が Inkling(OFF) の 8〜11 倍の
                            # 文字数になっていた（enclosure で 45,966 文字 vs 4,054 文字）
# MTP ドラフター: **旧 DeepSeek-V4-Flash（無印）から切り出した bf16**（3.4GB）。
#   0731 の内蔵 MTP（mtp.0/1/2・main_proj [4096,12288] の 3 系統連結）は mlx-vlm の
#   DeepseekV4MTPDraftModel（enorm/hnorm/e_proj/h_proj 構造）と**アーキテクチャ自体が別物**で
#   使えない。旧 Flash の mtp.0 は上流実装と完全一致し（動作実績のある
#   inferencerlabs/DeepSeek-V4-Flash-MTP-MLX の出所もこれ）、hidden_size も同じ 4096 なので
#   0731 本体のドラフターとして組める（投機デコードは lossless。旧型ドラフター故に採択率が
#   下がる可能性はあり、効果は実測で判断する）。
#   作成: hf download deepseek-ai/DeepSeek-V4-Flash（mtp は model-00046-of-00046 に隔離）
#         → python -m mlx_vlm.speculative.drafters.deepseek_v4_mtp.split
#   ⚠ split.py は get_model_path 経由でリポ全体（149GB）を取得するので注意（切り出し後は削除可）。
draft_model = "off"         # ← 上流バグで実用不能（下記）。短い生成では通るので注意
# draft_model = "/Users/octopus/mlx_models/DeepSeek-V4-Flash-MTP-bf16"
#   ⚠ ドラフトが**棄却されたときの巻き戻し**で落ちる:
#     models/deepseek_v4/language.py の rollback_speculative_cache が
#     "'list' object has no attribute 'max'" を投げる（CAD 評価で 152 回発生し、
#     全 7 課題が "no geometry produced" で失敗した）。
#   数十トークン程度の短い生成では棄却が起きず素通りするため、疎通確認では見抜けない。
#   実運用の長い生成では確実に踏むので off にしておくこと。

# vLLM（Linux/NVIDIA。Windows は WSL2 内で）。HF repo-id（safetensors）を指定。高スループット:
# [[models]]
# model = "Qwen/Qwen3-8B"
# backend = "vllm"
# extra_args = ["--max-model-len", "8192"]   # vLLM への個別フラグはそのまま渡る（任意）
#
# SGLang（vLLM の対抗。プレフィックス共有が多いエージェント用途に強い）。model は HF repo-id:
# [[models]]
# model = "Qwen/Qwen3-8B"
# backend = "sglang"
# extra_args = ["--context-length", "8192"]  # SGLang への個別フラグはそのまま渡る（任意）
#
# llama.cpp GGUF（vision・parallel）。model は HF repo-id（org/repo[:量子化]）。mmproj は自動検出:
# [[models]]
# model = "unsloth/Qwen3.6-27B-GGUF:UD-Q4_K_XL"
# backend = "llama-cpp"
# parallel = 4
# disable_thinking = true
#
# llama.cpp GGUF（埋め込み MTP・テキスト専用・~1.5-2倍速）。vision/parallel>1 は併用不可:
# [[models]]
# model = "unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL"
# backend = "llama-cpp"
# disable_thinking = true
# draft_model = "self"      # 本体内蔵 MTP を使う（--spec-type draft-mtp）
#
# llama.cpp GGUF（別ヘッド MTP）。draft に MTP ヘッド repo-id を指定（vision と併用可）:
# [[models]]
# model = "unsloth/gemma-4-26B-A4B-it-qat-GGUF"
# backend = "llama-cpp"
# parallel = 4
# disable_thinking = true
# draft_model = "unsloth/gemma-4-26B-A4B-it-qat-GGUF:F16-MTP"
#
# 音声認識（STT）。mlx-whisper を OpenAI 互換の /v1/audio/transcriptions として束ねる。
# ID に whisper/parakeet を含めば動的ロードで自動判定されるので、通常この事前登録も不要。
# 音声デコードに ffmpeg CLI が要る（→ docs/gateway.md「音声認識（STT / whisper）」）:
# [[models]]
# model = "mlx-community/whisper-large-v3-turbo"
# backend = "whisper"
