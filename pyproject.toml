[project]
name = "local-llm-server"
version = "0.38.3"
description = "ローカルLLM（mlx / mlx-vlm / llama.cpp / vLLM / SGLang）を OpenAI 互換 API で束ねるマルチモデルゲートウェイ（サーバー）。gateway.toml のカタログを 1 ポートで配信し、model で振り分け・遅延起動・LRU 退避・MTP 高速化（Ollama 流の共有デーモン）。接続用クライアントは別パッケージ local-llm-client。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ToPo-ToPo-ToPo" }]
keywords = ["llm", "local-llm", "mlx", "mlx-vlm", "llama.cpp", "openai", "server", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Operating System :: OS Independent",
]
# ゲートウェイ本体も CLI（gw start/stop/status/ps/...）も標準ライブラリのみで動く（純粋な
# HTTP 転送＋プロセス管理＋argparse）。コア依存はメモリガード用の psutil のみ。
# mlx 系バックエンドは環境マーカーで **Apple Silicon (macOS arm64) のときだけ自動インストール**する
# （他 OS / Intel Mac では入らず、llama.cpp を各自で用意）。なので `uv sync` だけでよく、extra 指定は不要。
# 接続用クライアントは別パッケージ local-llm-client。
dependencies = [
    # メモリガード（max_memory_fraction）で総RAM/空き容量を取得する。クロスプラットフォーム。
    "psutil>=5.9",
    # mlx 系バックエンド（テキスト/vision/STT）。Apple Silicon でのみ解決・インストールされる。
    "mlx-lm>=0.31.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # 0.6.9 以上を要求する。理由は 3 つ:
    # ① 0.6.4 の Qwen3.6 garble（変換・推論とも壊れる）が 0.6.5 で直った
    #    （norm の +1.0 シフトを raw-HF レイアウト限定に絞る修正）。
    # ② 0.6.3 + mlx 0.32.0 では Qwen3.6（qwen3_5 系）の**画像入力**が必ず失敗した
    #    （get_rope_index の attention_mask.tolist() が生成スレッドで
    #    `RuntimeError: There is no Stream(gpu, N) in current thread`）。0.6.4 の
    #    「position_ids を model に stash せずリクエスト毎に返す」リファクタで解消。
    # ③ 0.6.9 で Inkling 対応が完成した。0.6.7/0.6.8 は公式チェックポイントを
    #    **公開ローダー経路で一切読めず**（sub-config の再エクスポート漏れ・
    #    inkling_mm_model の別名未登録・prompt_utils.MODEL_CONFIG 未登録）、加えて
    #    MoE の global_scale / gate.bias を実装しておらず、当時の変換物はこの重みを
    #    **黙って落としていた**（＝本来の推論と異なる）。0.6.9 は公式 config を
    #    そのまま読み、これらの重みも扱う。0.6.9 未満に落とすと Inkling が壊れる。
    "mlx-vlm>=0.6.9 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # mlx-vlm 0.6.5+ が transformers>=5.14 を要求する（0.6.4 は <5.13 に固定していた）。
    "transformers>=5.14",
    # Inkling 系（thinkingmachines/Inkling*）の processor が要求する。transformers の
    # InklingImageProcessor は torchvision バックエンドしか持たず（slow/PIL 版が無い）、
    # 未導入だと AutoProcessor が ValueError を投げてモデルサーバーが起動すらできない。
    # wheel 自体は ~2MB で、torch は transformers 経由で既に入っている。mlx-vlm と同じく
    # Apple Silicon でのみ解決させる（他 OS は llama.cpp 経路で Inkling を使う）。
    "torchvision ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # STT（音声→テキスト）バックエンド。backend="whisper" が同梱の stt_server 経由で使う。
    # Apple Silicon でのみ解決・インストールされる。
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # ffmpeg を pip 同梱バイナリで供給する（brew/apt を使わず uv だけで完結）。用途は 2 つ:
    # ① STT の音声デコード（Apple Silicon）② 動画入力のフレーム抽出（全 OS。video.py）。
    # 動画入力は llama-cpp / mlx-vlm どちらでも効くので、全 OS に入れる。
    "imageio-ffmpeg>=0.4.9",
    # 画像入力の長辺リサイズ（image_max_edge。image.py）。上流へ渡す前に縮めて vision トークンの
    # 爆発を防ぐ。mlx-vlm は Apple Silicon でこれを間接的に入れるが、llama.cpp 運用（他 OS）でも
    # 効かせたいので全 OS の直接依存にする。未導入環境では縮小せず素通しする実装にしてある。
    "pillow>=10",
    # メニューバー常駐アイコン（tray.py。Ollama 流の「動いていることが見える」）。macOS のみ。
    # rumps は使わない——非推奨 API 依存で最新 macOS では表示されない。AppKit を直接使う。
    "pyobjc-framework-Cocoa>=10 ; sys_platform == 'darwin'",
]

# 高スループット生成バックエンド（明示 opt-in の extras）。torch+CUDA を含む重量級で、
# Linux/NVIDIA 専用（Windows は WSL2 内、macOS 非対応）なので base 依存には入れず、
# 使う人だけ `uv pip install local-llm-server[vllm]` 等で入れる（→ [vllm]/[sglang] provision='system'）。
# vLLM と SGLang は torch/flashinfer のピンが食い違い**同一環境に共存できないことが多い**ため、
# 両方使いたいときは各 backend の provision='auto'（隔離 venv・別環境）を使う。
# 環境マーカーで Linux 以外では解決対象から外す（Mac/Win にネイティブ wheel が無い）。
[project.optional-dependencies]
vllm = ["vllm ; sys_platform == 'linux'"]
sglang = ["sglang ; sys_platform == 'linux'"]

# vLLM と SGLang は同一環境に共存できない（torch/flashinfer のピンが食い違う）。排他 extras
# として宣言し、uv が両者を1つの解決に混ぜない／同時 install を拒む（両立は各 provision='auto'
# の隔離 venv で）。
[tool.uv]
conflicts = [[{ extra = "vllm" }, { extra = "sglang" }]]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 結線テスト用（tests/test_client_integration.py）。対リポジトリで開発する公開クライアントを
    # PyPI 版で取り込み、server の変更が client の公開 API を壊していないかを常時検証する
    # （リポジトリ統合はしない決定 2026-06-28 / 再確認 2026-07-09。その代償をこのテストが担う）。
    "local-llm-client>=0.7.0",
]

[project.urls]
Repository = "https://github.com/ToPo-ToPo-ToPo/local-llm-server"

[project.scripts]
gw = "local_llm_server.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_llm_server*"]

# メニューバーアイコン（tray.py が読む同梱アセット）。
[tool.setuptools.package-data]
local_llm_server = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
