[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-lite"
version = "0.1.0"
description = "実験: よく使う MoE エキスパートを GPU に、残りを RAM/CPU に置く Gemma 4 用の推論エンジン（Strata 流の試作）"
requires-python = ">=3.11"
# torch は CUDA 版を先に入れる（PyPI の Windows 版 torch は CPU 専用）。README の手順を参照。
dependencies = [
    "torch>=2.8",
    "transformers>=5.14",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "psutil>=5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
strata-lite = "strata_lite.__main__:main"

[tool.setuptools.packages.find]
include = ["strata_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
